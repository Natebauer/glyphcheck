<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlyphCheck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <a class="nav-logo" href="#" data-page="compare">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <polygon points="10,2 17,6 17,14 10,18 3,14 3,6" stroke="currentColor" stroke-width="1.5" fill="none"/>
        <circle cx="10" cy="10" r="2" fill="currentColor"/>
      </svg>
      GlyphCheck
    </a>
    <div class="nav-links">
      <a href="#" class="nav-link" data-page="compare">Compare</a>
      <a href="#" class="nav-link" data-page="specimens">Specimens</a>
      <a href="#" class="nav-link" data-page="pairings">Pairings</a>
      <a href="#" class="nav-link" data-page="collections">Collections</a>
      <a href="#" class="nav-link" data-page="fonts">Google Fonts</a>
    </div>
    <div class="nav-actions">
      <button class="nav-icon-btn" id="navSearchBtn" title="Search fonts">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
          <circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10 10l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="upgrade-btn">UPGRADE</button>
    </div>
  </nav>

  <main id="app"></main>

  <!-- Quick Search Overlay -->
  <div class="search-overlay" id="searchOverlay">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="search-icon">
        <circle cx="7" cy="7" r="5" stroke="#888" stroke-width="1.5"/>
        <path d="M11 11l3 3" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input type="text" id="quickSearchInput" placeholder="Search fonts...">
      <kbd class="esc-hint">ESC</kbd>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>

  <!-- Add Font Modal -->
  <div class="modal-backdrop" id="addFontModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Add Font to Compare</h3>
        <button class="modal-close" id="modalClose">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="modal-search-wrap">
        <input type="text" id="modalSearchInput" placeholder="Search Google Fonts...">
      </div>
      <div class="modal-font-list" id="modalFontList"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
